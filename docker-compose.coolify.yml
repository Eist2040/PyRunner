# PyRunner — EliteX Coolify Compose
#
# Builds from local Dockerfile (not the published image) so all migrations
# including 0022_add_one_minute_interval run correctly.
#
# Connects to s3030apovq5ycwkh4yp12sif (Brain Gateway's network) so
# GATEWAY_URL = http://brain-gateway:8001/v1 resolves by DNS permanently.
#
# Storage bind mount: /opt/elitex/storage is shared with WordPress
# so elitex-dl.php can stream ZIPs directly without volume juggling.
#
# SpatialFX upload bind mount: /opt/elitex/spatialfx-uploads is a SEPARATE
# shared mount (also read-write here) used only by the SpatialFX Deep tier.
# It's split out from /opt/elitex/storage above because that mount is
# read_only: true on the WordPress side — WordPress's spatialfx upload
# handler needs to write source files somewhere PyRunner can also see them,
# and /opt/elitex/storage can't be that place while it stays read-only there.
# Set UPLOAD_TMP_PATH = /opt/elitex/spatialfx-uploads in PyRunner secrets
# for the spatialfx script (STORAGE_PATH stays as-is, unaffected).

services:
  pyrunner:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - SERVICE_FQDN_PYRUNNER_8000
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@pyrunner.local}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - USE_RESEND=${USE_RESEND:-False}
      - Q_WORKERS=${Q_WORKERS:-12}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    volumes:
      - pyrunner_data:/app/data
      # Shared storage — PyRunner scripts write ZIPs here.
      # WordPress mounts the same path to stream downloads.
      # Set STORAGE_PATH = /opt/elitex/storage/jobs in PyRunner secrets.
      - type: bind
        source: /opt/elitex/storage
        target: /opt/elitex/storage
      # NEW — shared with WordPress for the SpatialFX Deep tier upload
      # handoff. See header comment above for why this is a separate mount
      # from /opt/elitex/storage rather than a subfolder of it.
      - type: bind
        source: /opt/elitex/spatialfx-uploads
        target: /opt/elitex/spatialfx-uploads
    networks:
      - default
      - brain-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6144M
          cpus: "4.0"

volumes:
  pyrunner_data:
    driver: local

networks:
  default:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
  brain-gateway:
    external: true
    name: s3030apovq5ycwkh4yp12sif
