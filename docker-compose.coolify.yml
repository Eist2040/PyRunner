version: "3.9"

services:
  pyrunner:
    build:
      context: .
      dockerfile: Dockerfile

    image: hasanaboulhasan/pyrunner:latest
    restart: unless-stopped

    expose:
      - "8000"

    environment:
      PORT: 8000

      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}

      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@pyrunner.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      USE_RESEND: ${USE_RESEND:-False}

      Q_WORKERS: ${Q_WORKERS:-2}

      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

      GATEWAY_URL: ${GATEWAY_URL:-http://brain-gateway:8001/v1}

      # Coolify auto injects these
      SERVICE_FQDN_PYRUNNER_8000: ${SERVICE_FQDN_PYRUNNER_8000}

    volumes:
      - pyrunner_data:/app/data
      - type: bind
        source: /opt/elitex/storage
        target: /opt/elitex/storage

    networks:
      - default
      - brain-gateway

    labels:
      - traefik.enable=true
      - traefik.http.routers.pyrunner.entrypoints=https
      - traefik.http.routers.pyrunner.rule=Host(`pyrunner.elitextools.com`)
      - traefik.http.routers.pyrunner.tls=true
      - traefik.http.routers.pyrunner.tls.certresolver=letsencrypt
      - traefik.http.services.pyrunner.loadbalancer.server.port=8000
      - traefik.docker.network=${COOLIFY_NETWORK:-coolify}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pyrunner_data:
    driver: local

networks:
  default:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}

  brain-gateway:
    external: true
    name: s3030apovq5ycwkh4yp12sif
